<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple TODO with LocalStorage</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .container { max-width: 500px; margin: auto; }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 8px 14px;
      border: none;
      background-color: #2563eb;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .task {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }
    .title { font-weight: bold; font-size: 16px; }
    .desc { margin-top: 5px; color: #444; }
  </style>
</head>

<body>
  <div class="container">
    <h2>Simple TODO</h2>

    <input id="title" type="text" placeholder="Enter task title" />
    <textarea id="desc" placeholder="Enter task description"></textarea>
    <button onclick="addTask()">Add Task</button>

    <div id="taskList"></div>
  </div>

  <script>
    const STORAGE_KEY = "simpleTodoList";

    // Load saved tasks on page load
    document.addEventListener("DOMContentLoaded", loadTasks);

    function loadTasks() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;

      const tasks = JSON.parse(saved);

      tasks.forEach(task => {
        renderTask(task.title, task.description);
      });
    }

    function addTask() {
      const title = document.getElementById("title").value.trim();
      const desc = document.getElementById("desc").value.trim();

      if (!title) {
        alert("Title is required!");
        return;
      }

      // Render on screen
      renderTask(title, desc);

      // Save to localStorage
      saveTask(title, desc);

      // Clear input fields
      document.getElementById("title").value = "";
      document.getElementById("desc").value = "";
    }

    function renderTask(title, desc) {
      const taskDiv = document.createElement("div");
      taskDiv.className = "task";

      taskDiv.innerHTML = `
        <div class="title">${title}</div>
        <div class="desc">${desc}</div>
      `;

      document.getElementById("taskList").appendChild(taskDiv);
    }

    function saveTask(title, description) {
      const saved = localStorage.getItem(STORAGE_KEY);
      const tasks = saved ? JSON.parse(saved) : [];

      tasks.push({ title, description });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }
  </script>
</body>
</html>
